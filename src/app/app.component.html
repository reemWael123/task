<div class="app-layout">
  <!-- Top Navigation Header -->
  <app-header (toggleSimulator)="onToggleSimulator()"></app-header>

  <!-- Global Error Notification Banner with Retry -->
  <div class="error-banner" *ngIf="facade.error as errorMsg" role="alert">
    <div class="error-banner-content">
      <span class="error-icon">⚠️</span>
      <span class="error-text">{{ errorMsg }}</span>
    </div>
    <div class="error-banner-actions">
      <button
        type="button"
        class="btn-retry"
        (click)="facade.resynchronize().subscribe()"
        [disabled]="facade.isLoading"
      >
        {{ facade.isLoading ? '⏳ Retrying...' : '🔄 Retry' }}
      </button>
      <button
        type="button"
        class="btn-dismiss"
        (click)="facade.clearError()"
        title="Dismiss error"
      >✕</button>
    </div>
  </div>

  <!-- SLA Policy Simulator Drawer / Panel -->
  <app-sla-simulator
    *ngIf="showSimulator"
    (close)="showSimulator = false"
  ></app-sla-simulator>

  <!-- Urgent Escalation Queue -->
  <app-escalation-queue
    (selectTicket)="onSelectTicket($event)"
  ></app-escalation-queue>

  <!-- Main Content: Ticket Board with Virtual Scrolling -->
  <main class="main-content">
    <app-ticket-board
      (selectTicket)="onSelectTicket($event)"
    ></app-ticket-board>
  </main>

  <!-- Bottom Panel: Agent Roster and Capacity -->
  <footer class="footer-roster">
    <app-agents-panel></app-agents-panel>
  </footer>

  <!-- Ticket Detail Drawer Overlay -->
  <app-ticket-detail
    *ngIf="selectedTicket"
    [ticket]="selectedTicket"
    (close)="onCloseDetail()"
  ></app-ticket-detail>
</div>
